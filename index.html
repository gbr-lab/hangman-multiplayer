<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impiccato Multiplayer con Vite</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">

    <!-- MENU PRINCIPALE -->
    <div id="menu-screen" class="screen active">
      <h1>Impiccato Multiplayer</h1>
      <div class="menu-box">
        <input type="text" id="username-input" placeholder="Il tuo nickname" maxlength="15">
        <button id="create-room-btn" class="btn primary">Crea Stanza</button>
        <div class="join-section">
          <input type="text" id="room-code-input" placeholder="Codice Stanza" maxlength="6">
          <button id="join-room-btn" class="btn secondary">Entra con Codice</button>
        </div>
      </div>
    </div>

    <!-- STANZA DI ATTESA / PERSONALIZZAZIONE -->
    <div id="room-screen" class="screen">
      <h2>Stanza: <span id="display-room-code">------</span></h2>
      <div class="room-content">
        <div class="players-list-box">
          <h3>Giocatori</h3>
          <ul id="players-ul"></ul>
        </div>

        <div class="customization-box">
          <h3>Personalizza il tuo Stickman</h3>
          <div class="avatar-preview-container">
            <canvas id="avatar-canvas" width="100" height="120"></canvas>
          </div>
          <div class="custom-controls">
            <label>Colore: <input type="color" id="skin-color" value="#000000"></label>
            <label>Accessorio:
              <select id="accessory-select">
                <option value="none">Nessuno</option>
                <option value="hat">Cappellino</option>
                <option value="beard">Barba</option>
                <option value="glasses">Occhiali</option>
              </select>
            </label>
          </div>
        </div>

        <div class="settings-box" id="host-settings">
          <h3>Impostazioni Partita</h3>
          <label>Round:
            <select id="rounds-select">
              <option value="3">3 Round</option>
              <option value="5" selected>5 Round</option>
              <option value="10">10 Round</option>
            </select>
          </label>
          <label>Difficoltà:
            <select id="difficulty-select">
              <option value="easy">Facile (Parole semplici)</option>
              <option value="medium" selected>Medio</option>
              <option value="hard">Difficile</option>
            </select>
          </label>
        </div>
      </div>

      <button id="ready-btn" class="btn primary">Pronto</button>
      <button id="start-match-btn" class="btn primary hidden">Avvia Partita</button>
    </div>

    <!-- SCHERMO DI GIOCO -->
    <div id="game-screen" class="screen">
      <div id="room-badge" title="Codice Stanza per riconnessione">Codice: <span id="hud-room-code">------</span></div>

      <div class="game-header">
        <div id="round-info">Round 1/5</div>
        <div id="scores-list"></div>
      </div>

      <div class="game-main-area">
        <div class="canvas-container">
          <canvas id="hangman-canvas" width="200" height="250"></canvas>
        </div>
        <div class="word-area">
          <div id="word-display">_ _ _ _ _</div>
          <div id="hint-display">Indizio: -</div>
          <div id="role-announcement">Preparazione...</div>
        </div>
      </div>

      <div id="word-creator-panel" class="panel hidden">
        <h3>Tocca a te scrivere la parola!</h3>
        <input type="text" id="secret-word-input" placeholder="Inserisci parola">
        <input type="text" id="secret-hint-input" placeholder="Inserisci indizio">
        <button id="submit-word-btn" class="btn primary">Invia Parola</button>
      </div>

      <div id="keyboard-panel" class="panel hidden">
        <div id="virtual-keyboard"></div>
      </div>

      <!-- CHAT TESTUALE A SCOMPARSA -->
      <div id="chat-container" class="collapsed">
        <button id="chat-toggle-btn">💬 Chat</button>
        <div id="chat-box">
          <div id="chat-messages"></div>
          <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Scrivi un messaggio...">
            <button id="chat-send-btn">Invia</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Script principale gestito da Vite -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
